services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: beverlyhillscop
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d beverlyhillscop"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ops:ops@db:5432/beverlyhillscop

volumes:
  pgdata:
